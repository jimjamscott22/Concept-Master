<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">CSRF attack and token defense</title>
  <desc id="desc">A malicious site triggers the browser to send a bank request with an automatically attached session cookie, but the bank rejects it because it lacks the required CSRF token; a legitimate form supplies both.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#8b949e"/></marker></defs>
  <rect width="960" height="540" rx="28" fill="#0d1117"/>
  <text x="52" y="58" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="2">CROSS-SITE REQUEST FORGERY</text>
  <text x="52" y="94" fill="#e6edf3" font-family="IBM Plex Sans, sans-serif" font-size="30" font-weight="600">Cookies travel automatically; a CSRF token does not</text>
  <rect x="52" y="142" width="226" height="102" rx="15" fill="#161b22" stroke="#f85149" stroke-width="2"/>
  <text x="165" y="176" text-anchor="middle" fill="#f85149" font-family="JetBrains Mono, monospace" font-size="16">evil.example</text>
  <text x="165" y="204" text-anchor="middle" fill="#e6edf3" font-family="IBM Plex Sans, sans-serif" font-size="14">hidden transfer request</text>
  <text x="165" y="226" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="12">POST /transfer</text>
  <rect x="367" y="205" width="226" height="118" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="480" y="239" text-anchor="middle" fill="#58a6ff" font-family="JetBrains Mono, monospace" font-size="16">USER'S BROWSER</text>
  <text x="480" y="267" text-anchor="middle" fill="#e6edf3" font-family="IBM Plex Sans, sans-serif" font-size="14">adds bank session cookie</text>
  <rect x="400" y="283" width="160" height="23" rx="6" fill="#1c2128"/>
  <text x="480" y="299" text-anchor="middle" fill="#f0883e" font-family="JetBrains Mono, monospace" font-size="12">Cookie: session=abc</text>
  <path d="M278 193c61 0 43 71 77 71" stroke="#f85149" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="682" y="142" width="226" height="181" rx="16" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="795" y="176" text-anchor="middle" fill="#f0883e" font-family="JetBrains Mono, monospace" font-size="16">bank.example</text>
  <text x="795" y="208" text-anchor="middle" fill="#8b949e" font-family="IBM Plex Sans, sans-serif" font-size="14">state-changing request</text>
  <rect x="712" y="230" width="166" height="36" rx="8" fill="#1c2128" stroke="#f85149"/>
  <text x="795" y="253" text-anchor="middle" fill="#f85149" font-family="JetBrains Mono, monospace" font-size="13">CSRF token missing</text>
  <text x="795" y="298" text-anchor="middle" fill="#f85149" font-family="JetBrains Mono, monospace" font-size="17">403 REJECTED ×</text>
  <path d="M593 264h77" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="52" y="362" width="226" height="95" rx="15" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="165" y="394" text-anchor="middle" fill="#3fb950" font-family="JetBrains Mono, monospace" font-size="16">legitimate bank form</text>
  <text x="165" y="421" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="13">Cookie + hidden token</text>
  <text x="165" y="442" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="12">token=7f9...</text>
  <path d="M278 409h392" stroke="#3fb950" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="682" y="362" width="226" height="95" rx="15" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="795" y="398" text-anchor="middle" fill="#3fb950" font-family="JetBrains Mono, monospace" font-size="16">token matches ✓</text>
  <text x="795" y="429" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="15">request accepted</text>
  <rect x="314" y="471" width="332" height="41" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="480" y="497" text-anchor="middle" fill="#8b949e" font-family="IBM Plex Sans, sans-serif" font-size="14">SameSite cookies add another layer of defense.</text>
</svg>
