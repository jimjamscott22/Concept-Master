<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Semaphore</title>
  <desc id="desc">A semaphore starts with two available permits. Threads A and B acquire one each. C waits when no permits are available, then acquires a permit after A releases one.</desc>
  <defs>
    <style>text{font-family:IBM Plex Sans,system-ui,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
    <marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a9b6c2"/></marker>
    <marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
  </defs>
  <g fill="#e6edf3">
    <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117"/>
    <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="64" y="99" font-size="36" font-weight="700">Semaphore</text>
    <path d="M64 125L896 125" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="171" font-size="23">Example with two permits</text>
    <rect x="64" y="220" width="156" height="151" rx="13" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="142" y="258" font-size="20" text-anchor="middle" font-weight="700">Start</text>
    <text x="142" y="306" font-size="24" fill="#3fb950" text-anchor="middle" class="mono" font-weight="700">2 free</text>
    <text x="142" y="345" font-size="19" text-anchor="middle" class="mono">—</text>
    <path d="M222 294L231 294" fill="none" stroke="#a9b6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <rect x="233" y="220" width="156" height="151" rx="13" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="311" y="258" font-size="20" text-anchor="middle" font-weight="700">A acquires</text>
    <text x="311" y="306" font-size="24" fill="#58a6ff" text-anchor="middle" class="mono" font-weight="700">1 free</text>
    <text x="311" y="345" font-size="19" text-anchor="middle" class="mono">A</text>
    <path d="M391 294L400 294" fill="none" stroke="#a9b6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <rect x="402" y="220" width="156" height="151" rx="13" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="480" y="258" font-size="20" text-anchor="middle" font-weight="700">B acquires</text>
    <text x="480" y="306" font-size="24" fill="#58a6ff" text-anchor="middle" class="mono" font-weight="700">0 free</text>
    <text x="480" y="345" font-size="19" text-anchor="middle" class="mono">A, B</text>
    <path d="M560 294L569 294" fill="none" stroke="#a9b6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <rect x="571" y="220" width="156" height="151" rx="13" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
    <text x="649" y="258" font-size="20" text-anchor="middle" font-weight="700">C waits</text>
    <text x="649" y="306" font-size="24" fill="#e3b341" text-anchor="middle" class="mono" font-weight="700">0 free</text>
    <text x="649" y="345" font-size="19" text-anchor="middle" class="mono">A, B</text>
    <path d="M729 294L738 294" fill="none" stroke="#a9b6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <rect x="740" y="220" width="156" height="151" rx="13" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="818" y="258" font-size="20" text-anchor="middle" font-weight="700">A releases</text>
    <text x="818" y="306" font-size="24" fill="#3fb950" text-anchor="middle" class="mono" font-weight="700">0 free</text>
    <text x="818" y="345" font-size="19" text-anchor="middle" class="mono">B, C</text>
    <text x="64" y="402" font-size="20" fill="#a9b6c2">Bottom row shows permit holders</text>
    <text x="818" y="447" font-size="20" fill="#3fb950" text-anchor="middle">C takes the permit</text>
    <path d="M817 425V374" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2)"/>
  </g>
</svg>
