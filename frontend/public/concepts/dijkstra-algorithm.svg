<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Dijkstra shortest-path relaxation</title>
  <desc id="desc">A non-negative weighted graph shows source A settled at distance zero, B chosen next at distance two, and B relaxing the route to C from seven down to five.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0l9 4.5L0 9z" fill="#f0883e"/></marker></defs>
  <rect width="960" height="540" rx="28" fill="#0d1117"/>
  <text x="52" y="58" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="2">SHORTEST PATH · NON-NEGATIVE EDGES</text>
  <text x="52" y="94" fill="#e6edf3" font-family="IBM Plex Sans, sans-serif" font-size="30" font-weight="600">Choose the closest node, then relax its neighbors</text>
  <g stroke="#30363d" stroke-width="4">
    <path d="M170 260L370 158M170 260l210 130M370 158l220 72M380 390l210-160M590 230l190 92"/>
  </g>
  <g fill="#0d1117" stroke="#30363d"><rect x="257" y="178" width="44" height="28" rx="7"/><rect x="264" y="318" width="44" height="28" rx="7"/><rect x="463" y="168" width="44" height="28" rx="7"/><rect x="466" y="294" width="44" height="28" rx="7"/><rect x="670" y="255" width="44" height="28" rx="7"/></g>
  <g fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="14" text-anchor="middle">
    <text x="279" y="197">2</text><text x="286" y="337">7</text><text x="485" y="187">3</text><text x="488" y="313">3</text><text x="692" y="274">1</text>
  </g>
  <g fill="#161b22" stroke-width="4">
    <circle cx="170" cy="260" r="45" stroke="#3fb950"/><circle cx="370" cy="158" r="45" stroke="#f0883e"/><circle cx="380" cy="390" r="45" stroke="#58a6ff"/><circle cx="590" cy="230" r="45" stroke="#58a6ff"/><circle cx="780" cy="322" r="45" stroke="#58a6ff"/>
  </g>
  <g fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="21" font-weight="600" text-anchor="middle">
    <text x="170" y="255">A</text><text x="370" y="153">B</text><text x="380" y="385">C</text><text x="590" y="225">D</text><text x="780" y="317">E</text>
  </g>
  <g font-family="JetBrains Mono, monospace" font-size="13" text-anchor="middle">
    <text x="170" y="280" fill="#3fb950">dist 0 ✓</text><text x="370" y="178" fill="#f0883e">dist 2</text><text x="380" y="410" fill="#3fb950">7 → 5</text><text x="590" y="250" fill="#8b949e">dist 5</text><text x="780" y="342" fill="#8b949e">dist 6</text>
  </g>
  <path d="M403 188L353 348" stroke="#f0883e" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <rect x="528" y="368" width="348" height="91" rx="14" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="702" y="398" text-anchor="middle" fill="#f0883e" font-family="JetBrains Mono, monospace" font-size="15">RELAX B → C</text>
  <text x="702" y="425" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="16">min(7, dist[B] + 3)</text>
  <text x="702" y="448" text-anchor="middle" fill="#3fb950" font-family="JetBrains Mono, monospace" font-size="16">min(7, 2 + 3) = 5</text>
  <rect x="52" y="468" width="420" height="44" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="262" y="495" text-anchor="middle" fill="#8b949e" font-family="IBM Plex Sans, sans-serif" font-size="14">A min-priority queue picks the next unsettled node.</text>
</svg>
