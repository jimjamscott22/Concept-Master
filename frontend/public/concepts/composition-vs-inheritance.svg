<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Composition vs Inheritance</title>
  <desc id="desc">Dog extends Animal to inherit breathe. A retriever has a Fetcher and a Swimmer and calls those objects to fetch or swim.</desc>
  <defs>
    <style>text{font-family:IBM Plex Sans,system-ui,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
    <marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
    <marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
  </defs>
  <g fill="#e6edf3">
    <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117"/>
    <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="64" y="99" font-size="36" font-weight="700">Composition vs Inheritance</text>
    <path d="M64 125L896 125" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="154" width="399" height="306" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <rect x="487" y="154" width="409" height="306" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="87" y="191" font-size="24" fill="#58a6ff" font-weight="700">Inheritance · is a</text>
    <text x="510" y="191" font-size="24" fill="#3fb950" font-weight="700">Composition · has a</text>
    <rect x="174" y="220" width="180" height="70" rx="13" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="264.0" y="250.0" font-size="22" fill="#58a6ff" text-anchor="middle" font-weight="700">Animal</text>
    <text x="264.0" y="278.0" font-size="18" text-anchor="middle">breathe()</text>
    <rect x="174" y="365" width="180" height="70" rx="13" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="264.0" y="395.0" font-size="22" fill="#58a6ff" text-anchor="middle" font-weight="700">Dog</text>
    <text x="264.0" y="423.0" font-size="18" text-anchor="middle">inherits breathe()</text>
    <path d="M264 359L264 298" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <text x="282" y="331" font-size="19" fill="#58a6ff">extends</text>
    <rect x="600" y="220" width="182" height="70" rx="13" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="691.0" y="263.0" font-size="22" fill="#3fb950" text-anchor="middle" font-weight="700">Retriever</text>
    <rect x="506" y="365" width="170" height="70" rx="13" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="591.0" y="395.0" font-size="22" fill="#3fb950" text-anchor="middle" font-weight="700">Fetcher</text>
    <text x="591.0" y="423.0" font-size="18" text-anchor="middle">fetch()</text>
    <rect x="705" y="365" width="170" height="70" rx="13" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="790.0" y="395.0" font-size="22" fill="#3fb950" text-anchor="middle" font-weight="700">Swimmer</text>
    <text x="790.0" y="423.0" font-size="18" text-anchor="middle">swim()</text>
    <path d="M629 290V319H591V357" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2)"/>
    <path d="M753 290V319H790V357" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2)"/>
    <text x="692" y="342" font-size="19" fill="#3fb950" text-anchor="middle">delegates</text>
  </g>
</svg>
