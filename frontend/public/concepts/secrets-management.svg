<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Secrets Management</title>
  <desc id="desc">An app authenticates to a secrets manager with its workload identity. A policy grants access, a short-lived credential is returned at runtime, and an audit log records the access event.</desc>
  <defs>
    <style>text{font-family:IBM Plex Sans,system-ui,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a9b6c2"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117" stroke="#0d1117" stroke-width="2"/>
  <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="98" fill="#e6edf3" font-size="36" text-anchor="start" font-weight="700">Secrets Management</text>
  <path d="M64 125H896" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="79" y="206" width="242" height="92" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="200.0" y="248.0" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700">Application</text>
  <text x="200.0" y="277.0" fill="#a9b6c2" font-size="20" text-anchor="middle">Workload identity</text>
  <rect x="615" y="206" width="262" height="92" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="746.0" y="248.0" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700">Secrets manager</text>
  <text x="746.0" y="277.0" fill="#a9b6c2" font-size="20" text-anchor="middle">Check access policy</text>
  <path d="M321 229H606" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <text x="468" y="206" fill="#58a6ff" font-size="21" text-anchor="middle">Authenticate and request</text>
  <path d="M615 272H330" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <text x="468" y="307" fill="#3fb950" font-size="21" text-anchor="middle">Short-lived credential</text>
  <path d="M746 298V375" fill="none" stroke="#a9b6c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-muted)"/>
  <rect x="615" y="384" width="262" height="79" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="746.0" y="419.5" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700">Audit log</text>
  <text x="746.0" y="448.5" fill="#a9b6c2" font-size="20" text-anchor="middle">Record access event</text>
</svg>
