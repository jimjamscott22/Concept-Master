<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Foreign Key</title>
  <desc id="desc">Two orders reference customer 7 by its primary key. An attempted order referencing customer 99 is rejected because the customers table has no matching row.</desc>
