<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Containerization</title>
  <desc id="desc">One app image contains the app, runtime, and libraries. The same image starts two isolated containers. Both containers on this host share its operating system kernel.</desc>
  <defs>
    <style>text{font-family:IBM Plex Sans,system-ui,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
    <marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
  </defs>
  <g fill="#e6edf3">
    <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117"/>
    <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="64" y="99" font-size="36" font-weight="700">Containerization</text>
    <path d="M64 125L896 125" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="343" y="147" width="274" height="80" rx="13" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="480.0" y="182.0" font-size="22" fill="#58a6ff" text-anchor="middle" font-weight="700">App image</text>
    <text x="480.0" y="210.0" font-size="18" text-anchor="middle">app + runtime + libraries</text>
    <rect x="102" y="269" width="756" height="203" rx="15" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="125" y="298" font-size="22" fill="#a9b6c2" font-weight="700">Host</text>
    <path d="M409 227V247H286V313" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <path d="M551 227V247H676V313" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <rect x="162" y="321" width="248" height="69" rx="13" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="286.0" y="350.5" font-size="22" fill="#3fb950" text-anchor="middle" font-weight="700">Container A</text>
    <text x="286.0" y="378.5" font-size="18" text-anchor="middle">isolated process</text>
    <rect x="552" y="321" width="248" height="69" rx="13" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="676.0" y="350.5" font-size="22" fill="#3fb950" text-anchor="middle" font-weight="700">Container B</text>
    <text x="676.0" y="378.5" font-size="18" text-anchor="middle">isolated process</text>
    <path d="M286 390L286 413" fill="none" stroke="#e3b341" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M676 390L676 413" fill="none" stroke="#e3b341" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="162" y="413" width="638" height="39" rx="13" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
    <text x="481.0" y="440.5" font-size="22" fill="#e3b341" text-anchor="middle" font-weight="700">Shared host OS kernel</text>
  </g>
</svg>
