<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">History, Search, and Debugging</title>
  <desc id="desc">A is known good and E is known bad. Testing C marks it bad, so the search narrows to B and C. B passes, making C the first bad commit in this history.</desc>
  <defs>
    <style>text{font-family:IBM Plex Sans,system-ui,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117" stroke="#0d1117" stroke-width="2"/>
  <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="98" fill="#e6edf3" font-size="36" text-anchor="start" font-weight="700">History, Search, and Debugging</text>
  <path d="M64 125H896" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M200 247H760" fill="none" stroke="#a9b6c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="200" cy="247" r="24" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="200" y="254" fill="#e6edf3" font-size="21" text-anchor="middle" font-weight="700" class="mono">A</text>
  <circle cx="340" cy="247" r="24" fill="#0d1117" stroke="#a9b6c2" stroke-width="2"/>
  <text x="340" y="254" fill="#e6edf3" font-size="21" text-anchor="middle" font-weight="700" class="mono">B</text>
  <circle cx="480" cy="247" r="24" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
  <text x="480" y="254" fill="#e6edf3" font-size="21" text-anchor="middle" font-weight="700" class="mono">C</text>
  <circle cx="620" cy="247" r="24" fill="#0d1117" stroke="#a9b6c2" stroke-width="2"/>
  <text x="620" y="254" fill="#e6edf3" font-size="21" text-anchor="middle" font-weight="700" class="mono">D</text>
  <circle cx="760" cy="247" r="24" fill="#0d1117" stroke="#ff7b72" stroke-width="2"/>
  <text x="760" y="254" fill="#e6edf3" font-size="21" text-anchor="middle" font-weight="700" class="mono">E</text>
  <text x="200" y="197" fill="#3fb950" font-size="21" text-anchor="middle">Known good</text>
  <text x="480" y="197" fill="#e3b341" font-size="21" text-anchor="middle">Test midpoint</text>
  <text x="760" y="197" fill="#ff7b72" font-size="21" text-anchor="middle">Known bad</text>
  <path d="M200 292V309H480V292" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="340" y="341" fill="#58a6ff" font-size="21" text-anchor="middle">C fails · search A to C</text>
  <path d="M340 364V381H480V364" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="410" y="418" fill="#3fb950" font-size="22" text-anchor="middle" font-weight="700">B passes · C is first bad</text>
</svg>
