<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Remotes and Synchronization</title>
  <desc id="desc">Fetch updates the local origin/main tracking reference from main on the remote. Pull fetches and then integrates into local main. Push publishes local commits to the remote branch.</desc>
  <defs>
    <style>text{font-family:IBM Plex Sans,system-ui,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117" stroke="#0d1117" stroke-width="2"/>
  <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="98" fill="#e6edf3" font-size="36" text-anchor="start" font-weight="700">Remotes and Synchronization</text>
  <path d="M64 125H896" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="68" y="165" width="535" height="290" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="644" y="165" width="248" height="290" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="92" y="199" fill="#e6edf3" font-size="22" text-anchor="start" font-weight="700">Local repository</text>
  <text x="768" y="199" fill="#e6edf3" font-size="22" text-anchor="middle" font-weight="700">Remote repository</text>
  <rect x="94" y="255" width="184" height="80" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="186.0" y="291.0" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700" class="mono">main</text>
  <text x="186.0" y="320.0" fill="#a9b6c2" font-size="20" text-anchor="middle">Local branch</text>
  <rect x="369" y="255" width="207" height="80" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="472.5" y="291.0" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700" class="mono">origin/main</text>
  <text x="472.5" y="320.0" fill="#a9b6c2" font-size="20" text-anchor="middle">Tracking reference</text>
  <rect x="676" y="255" width="184" height="80" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="768.0" y="291.0" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700" class="mono">main</text>
  <text x="768.0" y="320.0" fill="#a9b6c2" font-size="20" text-anchor="middle">Remote branch</text>
  <path d="M676 295H584" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <text x="627" y="277" fill="#58a6ff" font-size="21" text-anchor="middle" class="mono">fetch</text>
  <path d="M369 295H286" fill="none" stroke="#e3b341" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-amber)"/>
  <text x="324" y="265" fill="#e3b341" font-size="19" text-anchor="middle">integrate</text>
  <path d="M186 335V404H768V344" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <text x="479" y="431" fill="#3fb950" font-size="21" text-anchor="middle" class="mono">push</text>
  <text x="380" y="366" fill="#a9b6c2" font-size="21" text-anchor="middle" class="mono">pull = fetch + integrate</text>
</svg>
