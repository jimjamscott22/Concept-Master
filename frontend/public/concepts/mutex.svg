<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Mutex critical-section ownership</title>
  <desc id="desc">Thread A owns a mutex and updates shared state inside the critical section while Thread B waits until Thread A releases the lock.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#8b949e"/></marker></defs>
  <rect width="960" height="540" rx="28" fill="#0d1117"/>
  <text x="52" y="58" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="16" letter-spacing="2">MUTUAL EXCLUSION</text>
  <text x="52" y="94" fill="#e6edf3" font-family="IBM Plex Sans, sans-serif" font-size="30" font-weight="600">One owner enters the critical section at a time</text>
  <rect x="52" y="150" width="206" height="92" rx="15" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="155" y="184" text-anchor="middle" fill="#58a6ff" font-family="JetBrains Mono, monospace" font-size="17">THREAD A</text>
  <text x="155" y="213" text-anchor="middle" fill="#3fb950" font-family="JetBrains Mono, monospace" font-size="14">owns lock ✓</text>
  <path d="M258 196h92" stroke="#3fb950" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="360" y="140" width="348" height="210" rx="20" fill="#161b22" stroke="#3fb950" stroke-width="3"/>
  <text x="534" y="179" text-anchor="middle" fill="#3fb950" font-family="JetBrains Mono, monospace" font-size="17">LOCKED CRITICAL SECTION</text>
  <rect x="406" y="207" width="256" height="86" rx="13" fill="#1c2128" stroke="#30363d"/>
  <text x="534" y="238" text-anchor="middle" fill="#e6edf3" font-family="JetBrains Mono, monospace" font-size="15">read counter: 41</text>
  <text x="534" y="264" text-anchor="middle" fill="#f0883e" font-family="JetBrains Mono, monospace" font-size="15">write counter: 42</text>
  <text x="534" y="327" text-anchor="middle" fill="#8b949e" font-family="IBM Plex Sans, sans-serif" font-size="14">shared state stays consistent</text>
  <rect x="52" y="326" width="206" height="92" rx="15" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="155" y="360" text-anchor="middle" fill="#f0883e" font-family="JetBrains Mono, monospace" font-size="17">THREAD B</text>
  <text x="155" y="389" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="14">acquire → blocked</text>
  <path d="M258 372h82" stroke="#f0883e" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M340 353v38" stroke="#f85149" stroke-width="5"/>
  <rect x="754" y="183" width="154" height="124" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M806 231v-16a25 25 0 0150 0v16" stroke="#3fb950" stroke-width="7" stroke-linecap="round"/>
  <rect x="791" y="230" width="80" height="57" rx="10" fill="#1c2128" stroke="#3fb950" stroke-width="2"/>
  <circle cx="831" cy="253" r="6" fill="#3fb950"/><path d="M831 259v12" stroke="#3fb950" stroke-width="4"/>
  <text x="831" y="332" text-anchor="middle" fill="#8b949e" font-family="JetBrains Mono, monospace" font-size="13">owner: Thread A</text>
  <path d="M708 245h42" stroke="#8b949e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="52" y="454" width="856" height="52" rx="11" fill="#161b22" stroke="#30363d"/>
  <text x="480" y="486" text-anchor="middle" fill="#8b949e" font-family="IBM Plex Sans, sans-serif" font-size="16">Release transfers the opportunity to acquire; only the owner may unlock.</text>
</svg>
