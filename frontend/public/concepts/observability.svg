<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Observability</title>
  <desc id="desc">A latency metric shows when checkout slowed down. A request trace locates the slow span in payments, and a correlated log reports that a connection timed out.</desc>
  <defs>
    <style>text{font-family:IBM Plex Sans,system-ui,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117" stroke="#0d1117" stroke-width="2"/>
  <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="98" fill="#e6edf3" font-size="36" text-anchor="start" font-weight="700">Observability</text>
  <path d="M64 125H896" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="73" y="169" width="814" height="82" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="96" y="217" fill="#58a6ff" font-size="24" text-anchor="start" font-weight="700">Metrics</text>
  <text x="237" y="217" fill="#e6edf3" font-size="22" text-anchor="start">When did it slow down?</text>
  <text x="524" y="217" fill="#a9b6c2" font-size="21" text-anchor="start">p95 latency rose at 14:02</text>
  <rect x="73" y="270" width="814" height="82" rx="12" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
  <text x="96" y="318" fill="#e3b341" font-size="24" text-anchor="start" font-weight="700">Traces</text>
  <text x="237" y="318" fill="#e6edf3" font-size="22" text-anchor="start">Where was the delay?</text>
  <text x="524" y="318" fill="#a9b6c2" font-size="21" text-anchor="start">Trace 7 · checkout → payments</text>
  <rect x="73" y="371" width="814" height="82" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="96" y="419" fill="#3fb950" font-size="24" text-anchor="start" font-weight="700">Logs</text>
  <text x="237" y="419" fill="#e6edf3" font-size="22" text-anchor="start">What happened there?</text>
  <text x="524" y="419" fill="#a9b6c2" font-size="21" text-anchor="start">Trace 7 · connection timed out</text>
</svg>
