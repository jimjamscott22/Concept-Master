<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Infrastructure as Code</title>
  <desc id="desc">Versioned configuration defines a private logs bucket. The team reviews the proposed changes in a plan, then applies the plan to create the bucket.</desc>
  <defs>
    <style>text{font-family:IBM Plex Sans,system-ui,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117" stroke="#0d1117" stroke-width="2"/>
  <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="98" fill="#e6edf3" font-size="36" text-anchor="start" font-weight="700">Infrastructure as Code</text>
  <path d="M64 125H896" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="74" y="243" width="216" height="100" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="182.0" y="289.0" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700">Versioned config</text>
  <text x="182.0" y="318.0" fill="#a9b6c2" font-size="20" text-anchor="middle">Declare a logs bucket</text>
  <rect x="373" y="243" width="214" height="100" rx="12" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
  <text x="480.0" y="289.0" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700">Review plan</text>
  <text x="480.0" y="318.0" fill="#a9b6c2" font-size="20" text-anchor="middle">+1 bucket to create</text>
  <rect x="670" y="243" width="216" height="100" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="778.0" y="289.0" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700">Cloud resources</text>
  <text x="778.0" y="318.0" fill="#a9b6c2" font-size="20" text-anchor="middle">Private logs bucket</text>
  <path d="M290 293H365" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path d="M587 293H662" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <text x="331" y="267" fill="#58a6ff" font-size="20" text-anchor="middle">plan</text>
  <text x="628" y="267" fill="#3fb950" font-size="20" text-anchor="middle">apply</text>
</svg>
