<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval-Augmented Generation</title>
  <desc id="desc">At question time a retriever looks up relevant passages in the document index. The question and the retrieved passages are given to the language model, which generates an answer.</desc>
  <defs>
    <style>text{font-family:IBM Plex Sans,system-ui,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
    <marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
    <marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
    <marker id="arrow-3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e3b341"/></marker>
  </defs>
  <g fill="#e6edf3">
    <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117"/>
    <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="64" y="99" font-size="36" font-weight="700">Retrieval-Augmented Generation</text>
    <path d="M64 125L896 125" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="65" y="199" width="171" height="77" rx="13" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="150.5" y="245.5" font-size="22" fill="#58a6ff" text-anchor="middle" font-weight="700">Question</text>
    <rect x="317" y="199" width="200" height="77" rx="13" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="417.0" y="245.5" font-size="22" fill="#58a6ff" text-anchor="middle" font-weight="700">Retriever</text>
    <rect x="317" y="357" width="200" height="77" rx="13" fill="#0d1117" stroke="#e3b341" stroke-width="2"/>
    <text x="417.0" y="403.5" font-size="22" fill="#e3b341" text-anchor="middle" font-weight="700">Document index</text>
    <rect x="599" y="199" width="285" height="77" rx="13" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="741.5" y="232.5" font-size="22" fill="#3fb950" text-anchor="middle" font-weight="700">Language model</text>
    <text x="741.5" y="260.5" font-size="18" text-anchor="middle">question + passages</text>
    <rect x="599" y="357" width="285" height="77" rx="13" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="741.5" y="403.5" font-size="22" fill="#3fb950" text-anchor="middle" font-weight="700">Answer</text>
    <path d="M236 237L308 237" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <path d="M517 237L590 237" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2)"/>
    <path d="M150 199V160H741V190" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <path d="M379 276L379 348" fill="none" stroke="#e3b341" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-3)"/>
    <path d="M467 357L467 286" fill="none" stroke="#e3b341" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-3)"/>
    <text x="365" text-anchor="end" y="322" font-size="19" fill="#e3b341">search</text>
    <text x="482" y="322" font-size="19" fill="#e3b341">relevant passages</text>
    <path d="M741 276L741 348" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2)"/>
  </g>
</svg>
