<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Tree Traversal</title>
  <desc id="desc">The same binary tree yields preorder A B D E C, inorder D B E A C, postorder D E B C A, and level order A B C D E.</desc>
  <defs>
    <style>text{font-family:IBM Plex Sans,system-ui,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
  </defs>
  <g fill="#e6edf3">
    <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117"/>
    <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="64" y="99" font-size="36" font-weight="700">Tree Traversal</text>
    <path d="M64 125L896 125" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M239 197L153 286" fill="none" stroke="#a9b6c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M239 197L325 286" fill="none" stroke="#a9b6c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M153 286L100 389" fill="none" stroke="#a9b6c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M153 286L206 389" fill="none" stroke="#a9b6c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="239" cy="197" r="25" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="239" y="204" font-size="20" fill="#58a6ff" text-anchor="middle" class="mono" font-weight="700">A</text>
    <circle cx="153" cy="286" r="25" fill="#0d1117" stroke="#a9b6c2" stroke-width="2"/>
    <text x="153" y="293" font-size="20" fill="#a9b6c2" text-anchor="middle" class="mono" font-weight="700">B</text>
    <circle cx="325" cy="286" r="25" fill="#0d1117" stroke="#a9b6c2" stroke-width="2"/>
    <text x="325" y="293" font-size="20" fill="#a9b6c2" text-anchor="middle" class="mono" font-weight="700">C</text>
    <circle cx="100" cy="389" r="25" fill="#0d1117" stroke="#a9b6c2" stroke-width="2"/>
    <text x="100" y="396" font-size="20" fill="#a9b6c2" text-anchor="middle" class="mono" font-weight="700">D</text>
    <circle cx="206" cy="389" r="25" fill="#0d1117" stroke="#a9b6c2" stroke-width="2"/>
    <text x="206" y="396" font-size="20" fill="#a9b6c2" text-anchor="middle" class="mono" font-weight="700">E</text>
    <rect x="408" y="170" width="478" height="60" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="428" y="208" font-size="22" font-weight="700">Preorder</text>
    <text x="640" y="208" font-size="22" fill="#58a6ff" class="mono" font-weight="700">A</text>
    <text x="688" y="208" font-size="22" class="mono">B</text>
    <text x="736" y="208" font-size="22" class="mono">D</text>
    <text x="784" y="208" font-size="22" class="mono">E</text>
    <text x="832" y="208" font-size="22" class="mono">C</text>
    <rect x="408" y="249" width="478" height="60" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="428" y="287" font-size="22" font-weight="700">Inorder</text>
    <text x="640" y="287" font-size="22" class="mono">D</text>
    <text x="688" y="287" font-size="22" class="mono">B</text>
    <text x="736" y="287" font-size="22" class="mono">E</text>
    <text x="784" y="287" font-size="22" fill="#58a6ff" class="mono" font-weight="700">A</text>
    <text x="832" y="287" font-size="22" class="mono">C</text>
    <rect x="408" y="328" width="478" height="60" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="428" y="366" font-size="22" font-weight="700">Postorder</text>
    <text x="640" y="366" font-size="22" class="mono">D</text>
    <text x="688" y="366" font-size="22" class="mono">E</text>
    <text x="736" y="366" font-size="22" class="mono">B</text>
    <text x="784" y="366" font-size="22" class="mono">C</text>
    <text x="832" y="366" font-size="22" fill="#58a6ff" class="mono" font-weight="700">A</text>
    <rect x="408" y="407" width="478" height="60" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="428" y="445" font-size="22" font-weight="700">Level order</text>
    <text x="640" y="445" font-size="22" fill="#58a6ff" class="mono" font-weight="700">A</text>
    <text x="688" y="445" font-size="22" class="mono">B</text>
    <text x="736" y="445" font-size="22" class="mono">C</text>
    <text x="784" y="445" font-size="22" class="mono">D</text>
    <text x="832" y="445" font-size="22" class="mono">E</text>
  </g>
</svg>
