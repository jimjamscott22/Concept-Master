<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Merging, Rebasing, and Cherry-Picking</title>
  <desc id="desc">From a common commit A, main has C and the feature has B then D. A merge creates M with parents C and D. A rebase replays B and D as new commits on C. Cherry-picking D alone applies its change as D prime on C.</desc>
  <defs>
    <style>text{font-family:IBM Plex Sans,system-ui,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
    <marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
  </defs>
  <g fill="#e6edf3">
    <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117"/>
    <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="64" y="99" font-size="36" font-weight="700">Merge, Rebase, and Cherry-Pick</text>
    <path d="M64 125L896 125" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="65" y="160" font-size="20" fill="#a9b6c2">Starting point: main has C, feature has B then D</text>
    <rect x="64" y="177" width="832" height="92" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="84" y="229" font-size="23" font-weight="700">Merge</text>
    <path d="M328 222L406 204" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M328 223L406 243" fill="none" stroke="#a9b6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M426 244L537 244" fill="none" stroke="#a9b6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="327" cy="223" r="17" fill="#0d1117" stroke="#a9b6c2" stroke-width="2"/>
    <text x="327" y="230" font-size="20" fill="#a9b6c2" text-anchor="middle" class="mono" font-weight="700">A</text>
    <circle cx="422" cy="203" r="17" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="422" y="210" font-size="20" fill="#58a6ff" text-anchor="middle" class="mono" font-weight="700">C</text>
    <circle cx="422" cy="244" r="17" fill="#0d1117" stroke="#a9b6c2" stroke-width="2"/>
    <text x="422" y="251" font-size="20" fill="#a9b6c2" text-anchor="middle" class="mono" font-weight="700">B</text>
    <circle cx="553" cy="244" r="17" fill="#0d1117" stroke="#a9b6c2" stroke-width="2"/>
    <text x="553" y="251" font-size="20" fill="#a9b6c2" text-anchor="middle" class="mono" font-weight="700">D</text>
    <path d="M439 203L667 212" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <path d="M570 241L668 225" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <circle cx="686" cy="215" r="17" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="686" y="222" font-size="20" fill="#3fb950" text-anchor="middle" class="mono" font-weight="700">M</text>
    <text x="722" y="222" font-size="18" fill="#3fb950">two parents</text>
    <rect x="64" y="280" width="832" height="92" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="84" y="332" font-size="23" font-weight="700">Rebase</text>
    <path d="M328 325L406 307" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M328 326L406 346" fill="none" stroke="#a9b6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
    <path d="M426 347L537 347" fill="none" stroke="#a9b6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/>
    <circle cx="327" cy="326" r="17" fill="#0d1117" stroke="#a9b6c2" stroke-width="2"/>
    <text x="327" y="333" font-size="20" fill="#a9b6c2" text-anchor="middle" class="mono" font-weight="700">A</text>
    <circle cx="422" cy="306" r="17" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="422" y="313" font-size="20" fill="#58a6ff" text-anchor="middle" class="mono" font-weight="700">C</text>
    <circle cx="422" cy="347" r="17" fill="#0d1117" stroke="#a9b6c2" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="422" y="354" font-size="20" fill="#a9b6c2" text-anchor="middle" class="mono" font-weight="700">B</text>
    <circle cx="553" cy="347" r="17" fill="#0d1117" stroke="#a9b6c2" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="553" y="354" font-size="20" fill="#a9b6c2" text-anchor="middle" class="mono" font-weight="700">D</text>
    <path d="M439 306L534 306" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <path d="M570 306L667 306" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <circle cx="553" cy="306" r="17" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="553" y="313" font-size="20" fill="#3fb950" text-anchor="middle" class="mono" font-weight="700">B′</text>
    <circle cx="686" cy="306" r="17" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="686" y="313" font-size="20" fill="#3fb950" text-anchor="middle" class="mono" font-weight="700">D′</text>
    <text x="722" y="313" font-size="18" fill="#3fb950">new base</text>
    <rect x="64" y="383" width="832" height="92" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="84" y="435" font-size="23" font-weight="700">Cherry-pick D</text>
    <path d="M328 428L406 410" fill="none" stroke="#58a6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M328 429L406 449" fill="none" stroke="#a9b6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M426 450L537 450" fill="none" stroke="#a9b6c2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="327" cy="429" r="17" fill="#0d1117" stroke="#a9b6c2" stroke-width="2"/>
    <text x="327" y="436" font-size="20" fill="#a9b6c2" text-anchor="middle" class="mono" font-weight="700">A</text>
    <circle cx="422" cy="409" r="17" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="422" y="416" font-size="20" fill="#58a6ff" text-anchor="middle" class="mono" font-weight="700">C</text>
    <circle cx="422" cy="450" r="17" fill="#0d1117" stroke="#a9b6c2" stroke-width="2"/>
    <text x="422" y="457" font-size="20" fill="#a9b6c2" text-anchor="middle" class="mono" font-weight="700">B</text>
    <circle cx="553" cy="450" r="17" fill="#0d1117" stroke="#a9b6c2" stroke-width="2"/>
    <text x="553" y="457" font-size="20" fill="#a9b6c2" text-anchor="middle" class="mono" font-weight="700">D</text>
    <path d="M439 409L534 409" fill="none" stroke="#3fb950" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <circle cx="553" cy="409" r="17" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="553" y="416" font-size="20" fill="#3fb950" text-anchor="middle" class="mono" font-weight="700">D′</text>
    <text x="589" y="416" font-size="18" fill="#3fb950">one selected change</text>
  </g>
</svg>
