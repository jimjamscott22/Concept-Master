<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Rolling Deployment</title>
  <desc id="desc">A service starts with three version 1 replicas. The rollout replaces one replica at a time, waiting for the new replica to become ready before removing an old one.</desc>
