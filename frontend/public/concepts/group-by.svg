<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">GROUP BY</title>
  <desc id="desc">Orders with totals 20 and 15 for user 7 form one group and sum to 35. The order for user 8 forms its own group and sums to 10.</desc>
