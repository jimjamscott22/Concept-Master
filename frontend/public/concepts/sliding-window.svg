<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Sliding Window</title>
  <desc id="desc">Two length-three windows move across 4, 2, 7, 1, 5. The first sums to 13. Sliding one position drops 4, adds 1, and updates the sum to 10.</desc>
  <defs>
    <style>text{font-family:IBM Plex Sans,system-ui,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
    <marker id="arrow-1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7b72"/></marker>
    <marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
  </defs>
  <g fill="#e6edf3">
    <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117"/>
    <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="64" y="99" font-size="36" font-weight="700">Sliding Window</text>
    <path d="M64 125L896 125" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="311" y="175" font-size="18" fill="#a9b6c2" text-anchor="middle" class="mono">0</text>
    <text x="396" y="175" font-size="18" fill="#a9b6c2" text-anchor="middle" class="mono">1</text>
    <text x="481" y="175" font-size="18" fill="#a9b6c2" text-anchor="middle" class="mono">2</text>
    <text x="566" y="175" font-size="18" fill="#a9b6c2" text-anchor="middle" class="mono">3</text>
    <text x="651" y="175" font-size="18" fill="#a9b6c2" text-anchor="middle" class="mono">4</text>
    <text x="67" y="229" font-size="22" fill="#58a6ff" class="mono">Window 0–2</text>
    <text x="67" y="387" font-size="22" fill="#3fb950" class="mono">Window 1–3</text>
    <rect x="269" y="184" width="254" height="78" rx="12" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <rect x="278" y="193" width="66" height="60" rx="13" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="311.0" y="231.0" font-size="22" fill="#58a6ff" text-anchor="middle" font-weight="700">4</text>
    <rect x="363" y="193" width="66" height="60" rx="13" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="396.0" y="231.0" font-size="22" fill="#58a6ff" text-anchor="middle" font-weight="700">2</text>
    <rect x="448" y="193" width="66" height="60" rx="13" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="481.0" y="231.0" font-size="22" fill="#58a6ff" text-anchor="middle" font-weight="700">7</text>
    <rect x="533" y="193" width="66" height="60" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="566" y="231" font-size="22" fill="#a9b6c2" text-anchor="middle" class="mono">1</text>
    <rect x="618" y="193" width="66" height="60" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="651" y="231" font-size="22" fill="#a9b6c2" text-anchor="middle" class="mono">5</text>
    <text x="735" y="232" font-size="22" fill="#58a6ff" class="mono" font-weight="700">Sum = 13</text>
    <rect x="354" y="342" width="254" height="78" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <rect x="278" y="351" width="66" height="60" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="311" y="389" font-size="22" fill="#a9b6c2" text-anchor="middle" class="mono">4</text>
    <rect x="363" y="351" width="66" height="60" rx="13" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="396.0" y="389.0" font-size="22" fill="#3fb950" text-anchor="middle" font-weight="700">2</text>
    <rect x="448" y="351" width="66" height="60" rx="13" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="481.0" y="389.0" font-size="22" fill="#3fb950" text-anchor="middle" font-weight="700">7</text>
    <rect x="533" y="351" width="66" height="60" rx="13" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
    <text x="566.0" y="389.0" font-size="22" fill="#3fb950" text-anchor="middle" font-weight="700">1</text>
    <rect x="618" y="351" width="66" height="60" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="651" y="389" font-size="22" fill="#a9b6c2" text-anchor="middle" class="mono">5</text>
    <text x="735" y="390" font-size="22" fill="#3fb950" class="mono" font-weight="700">Sum = 10</text>
    <path d="M311 260L311 335" fill="none" stroke="#ff7b72" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <text x="328" y="307" font-size="20" fill="#ff7b72" class="mono">drop 4</text>
    <path d="M566 260L566 335" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-2)"/>
    <text x="583" y="307" font-size="20" fill="#3fb950" class="mono">add 1</text>
    <text x="480" y="467" font-size="26" text-anchor="middle" class="mono" font-weight="700">13 − 4 + 1 = 10</text>
  </g>
</svg>
