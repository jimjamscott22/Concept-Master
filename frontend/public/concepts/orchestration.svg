<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Orchestration</title>
  <desc id="desc">An orchestrator schedules three web replicas across two nodes. When one replica fails on node B, the orchestrator starts a replacement to restore the desired count.</desc>
  <defs>
    <style>text{font-family:IBM Plex Sans,system-ui,sans-serif}.mono{font-family:JetBrains Mono,monospace}</style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117" stroke="#0d1117" stroke-width="2"/>
  <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="64" y="98" fill="#e6edf3" font-size="36" text-anchor="start" font-weight="700">Orchestration</text>
  <path d="M64 125H896" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="91" y="163" width="241" height="75" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="211.5" y="208.5" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700">Desired: 3 replicas</text>
  <path d="M332 200H387" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <rect x="396" y="163" width="231" height="75" rx="12" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <text x="511.5" y="208.5" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700">Orchestrator</text>
  <path d="M511 238V271H272V297M511 271H688V297" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M272 297V311" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <path d="M688 297V311" fill="none" stroke="#58a6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
  <rect x="69" y="319" width="403" height="141" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <rect x="488" y="319" width="403" height="141" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="91" y="351" fill="#e6edf3" font-size="21" text-anchor="start" font-weight="700">Node A</text>
  <text x="510" y="351" fill="#e6edf3" font-size="21" text-anchor="start" font-weight="700">Node B</text>
  <rect x="89" y="374" width="170" height="58" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="174.0" y="411.0" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700">Web 1</text>
  <rect x="278" y="374" width="170" height="58" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="363.0" y="411.0" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700">Web 2</text>
  <rect x="510" y="374" width="147" height="58" rx="12" fill="#0d1117" stroke="#ff7b72" stroke-width="2"/>
  <text x="583.5" y="411.0" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700">Web 3 fails</text>
  <path d="M657 403H693" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-green)"/>
  <rect x="701" y="374" width="167" height="58" rx="12" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <text x="784.5" y="411.0" fill="#e6edf3" font-size="24" text-anchor="middle" font-weight="700">New replica</text>
</svg>
