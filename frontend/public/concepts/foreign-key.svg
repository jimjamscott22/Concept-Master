    <marker id="arrow-2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7b72"/></marker>
  </defs>
  <g fill="#e6edf3">
    <rect x="0" y="0" width="960" height="540" rx="28" fill="#0d1117"/>
    <rect x="32" y="32" width="896" height="476" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <text x="64" y="99" font-size="36" font-weight="700">Foreign Key</text>
    <path d="M64 125L896 125" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="83" y="173" font-size="26" class="mono" font-weight="700">orders</text>
    <text x="618" y="173" font-size="26" class="mono" font-weight="700">customers</text>
    <rect x="81" y="192" width="290" height="149" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <rect x="609" y="192" width="274" height="149" rx="13" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="96" y="223" font-size="20" fill="#a9b6c2" class="mono">id</text>
    <text x="192" y="223" font-size="20" fill="#a9b6c2" class="mono">customer_id</text>
    <text x="624" y="223" font-size="20" fill="#a9b6c2" class="mono">id</text>
    <text x="720" y="223" font-size="20" fill="#a9b6c2" class="mono">name</text>
    <path d="M94 239L358 239" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M622 239L870 239" fill="none" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="96" y="274" font-size="22" class="mono">101</text>
    <text x="192" y="274" font-size="22" fill="#58a6ff" class="mono" font-weight="700">7</text>
    <text x="96" y="315" font-size="22" class="mono">102</text>
    <text x="192" y="315" font-size="22" fill="#58a6ff" class="mono" font-weight="700">7</text>
    <text x="624" y="274" font-size="22" fill="#3fb950" class="mono" font-weight="700">7</text>
    <text x="720" y="274" font-size="22">Ada</text>
    <text x="624" y="315" font-size="22" class="mono">8</text>
    <text x="720" y="315" font-size="22">Bo</text>
    <path d="M371 267H602" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-1)"/>
    <path d="M371 308H479Q501 308 501 287V267" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
